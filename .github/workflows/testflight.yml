name: TestFlight

# Signs with an App Store Connect API key (Xcode cloud-managed signing), so no
# certificates or provisioning profiles are stored in the repo or in secrets.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # increases on every run and re-run, as App Store Connect requires
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        # App Store Connect only accepts builds made with the current major Xcode/SDK
        run: xcodebuild -version && xcodebuild -showsdks | grep -i iphoneos

      - name: Check secrets
        run: |
          missing=""
          for s in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID; do [ -n "${!s}" ] || missing="$missing $s"; done
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these repository secrets:$missing (APPLE_TEAM_ID for TEAM_ID)"
            exit 1
          fi

      - name: Install API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive
        # Unsigned: automatic signing at archive time wants a development profile, which
        # needs registered devices. The export step signs for App Store distribution.
        run: |
          set -o pipefail
          xcodebuild archive \
            -project OBDLive.xcodeproj \
            -scheme OBDLive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OBDLive.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          if ! grep -q "ARCHIVE SUCCEEDED" archive.log; then
            err=$(grep -E "error:" archive.log | sort -u | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Archive failed::$err"
            exit 1
          fi

      - name: Sign for App Store
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OBDLive.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -E "error|EXPORT (SUCCEEDED|FAILED)" || true
          if ! grep -q "EXPORT SUCCEEDED" export.log; then
            err=$(tail -40 export.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Signing failed::$err"
            exit 1
          fi
          ls -l "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        run: |
          # altool looks for the key as ~/.appstoreconnect/private_keys/AuthKey_<id>.p8
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$KEY_PATH" ~/.appstoreconnect/private_keys/
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          # Apple's upload service sometimes answers 5xx; retry those with a pause.
          for attempt in 1 2 3 4; do
            if xcrun altool --upload-app --type ios --file "$ipa" \
                 --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > upload.log 2>&1; then
              break
            fi
            if grep -qiE "already been uploaded|DUPLICATE" upload.log; then
              echo "Build $BUILD_NUMBER was already uploaded by an earlier attempt."
              break
            fi
            if [ $attempt -lt 4 ] && grep -qE "Status Code: 5[0-9][0-9]|timed out|network" upload.log; then
              echo "Attempt $attempt failed with a server error; retrying in $((attempt * 60)) s"
              sleep $((attempt * 60))
              continue
            fi
            err=$(grep -vE "^\s*$|<|NSLocalized" upload.log | tail -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Upload failed::$err"
            exit 1
          done
          tail -5 upload.log
          echo "::notice title=Uploaded::Build $BUILD_NUMBER is processing in App Store Connect. It appears under TestFlight in 5-15 minutes."

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" ~/.appstoreconnect/private_keys

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
            upload.log
          if-no-files-found: ignore
