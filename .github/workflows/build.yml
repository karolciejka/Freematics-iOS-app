name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: OBDCore tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run tests
        working-directory: OBDCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || {
            # surface failures as an annotation so they're readable without the raw log
            msg=$(grep -E "error:|failed|XCTAssert" test.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=OBDCore tests failed::$msg"
            exit 1
          }

  app:
    name: App (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build
        # Simulator build needs no signing; this checks that the app compiles.
        run: |
          set -o pipefail
          xcodebuild build \
            -project OBDLive.xcodeproj \
            -target OBDLive \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          warn=$(grep -E "warning:" build.log | grep -v "/DerivedData/" | sort -u | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$warn" ] && echo "::warning title=Compiler warnings::$warn"
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            err=$(grep -E "error:" build.log | sort -u | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$err"
            exit 1
          fi
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
